      - document_qa
      - default_text
      - complex_reasoning

  # ── Coding ───────────────────────────────────────────────
  - name: qwen25_coder_7b
    # Small code tier.  Pull to reduce the combined 4-model memory footprint:
    #   ollama pull qwen2.5-coder:7b-instruct-q4_K_M
    # If NOT pulled, the tier resolver will emergency-fall back to qwen25_coder_14b
    # (the smallest available coder model on this machine).
    ollama_tag: "qwen2.5-coder:7b-instruct-q4_K_M"
    endpoint: "http://localhost:11434"
    modality: code
    context_length: 32768
    tier: small
    est_vram_mb: 4700
    capability_tags:
      - code_generation
      - code_review
      - debugging
      - refactoring

  - name: qwen25_coder_14b
    # Currently pulled as: qwen2.5-coder:14b (plain tag, no quant suffix).
    # This is the only coder model available on this machine right now.
    ollama_tag: "qwen2.5-coder:14b"
    endpoint: "http://localhost:11434"
    modality: code
    context_length: 32768
    tier: mid
    est_vram_mb: 9000
    capability_tags:
      - code_generation
      - code_review
      - debugging
      - refactoring
      - complex_code

  # ── Vision ────────────────────────────────────────────────

# ============================================================
# Sovereign Workbench — Model Registry
# ============================================================
# This file is the SINGLE source of truth for every model
# available to the system. No model may be called at runtime
# unless it has an entry here.
#
# Schema per entry:
#   name           : human-readable key used throughout the codebase
#   ollama_tag     : exact tag passed to `ollama pull` / the Ollama API
#   endpoint       : Ollama OpenAI-compatible base URL (always localhost)
#   modality       : text | vision | code | embedding
#   context_length : maximum context window in tokens
#   capability_tags: free-form list used by the router for capability matching
#   tier           : size class — small | mid | large | default
#                    Used by tier_resolver to select the best model for
#                    the available VRAM budget.
#   est_vram_mb    : estimated VRAM footprint in MB at the chosen quant.
#                    Informational — used by tier_resolver to stay within
#                    the detected free-VRAM budget (with 15% headroom).
#
# IMPORTANT: endpoint must never point to any host other than localhost.
# ============================================================

models:
  # ── General / Reasoning ──────────────────────────────────
  - name: qwen25_7b_instruct
    ollama_tag: "qwen2.5:7b-instruct-q4_K_M"
    endpoint: "http://localhost:11434"
    modality: text
    context_length: 32768
    tier: small
    est_vram_mb: 4500
    capability_tags:
      - chat
      - reasoning
      - summarization
      - document_qa
      - default_text

  - name: qwen25_14b_instruct
    ollama_tag: "qwen2.5:14b-instruct-q4_K_M"
    endpoint: "http://localhost:11434"
    modality: text
    context_length: 32768
